name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 54321:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ScorerApp.Tests/ScorerApp.Tests.csproj

      - name: Build
        run: dotnet build src/ScorerApp.Tests/ScorerApp.Tests.csproj --no-restore --configuration Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=54321;Database=ci_test_db;Username=postgres;Password=postgres"
          # DB testy jinak berou připojení z appsettings.Development.json (localhost:5432), kde v CI nic neběží.
          SCORERAPP_TEST_DB: "Host=localhost;Port=54321;Database=ScorerApp_Tests;Username=postgres;Password=postgres"
        run: dotnet test src/ScorerApp.Tests/ScorerApp.Tests.csproj --no-build --configuration Release --verbosity normal
      # Artefakt `publish` nasazuje ~/deploy-to-qnap.sh místo lokálního `dotnet publish` na Macu.
      # appsettings.Production.json v gitu není, zůstává na QNAPu.
      - name: Publish
        if: github.event_name == 'push'
        run: dotnet publish src/ScorerApp.Web/ScorerApp.Web.csproj --configuration Release -o publish

      - name: Upload artefakt publish
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish/
          retention-days: 2   # deploy běží hned po CI; rollback řeší .prev na QNAPu
          if-no-files-found: error
